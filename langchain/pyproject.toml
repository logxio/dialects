[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dialects-page-stats-langchain"
version = "0.1.0"
description = "LangChain tool that reads a web page and reports its title and word count"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Yan Su" }]
keywords = ["langchain", "agent", "tool"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["langchain-core>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/dialects_page_stats"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
